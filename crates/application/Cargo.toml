[package]
name = "local-agent-terminal-application"
version = "0.1.0"
edition = "2021"

[dependencies]
local-agent-terminal-domain = { path = "../domain" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_json_canonicalizer = "0.3"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "parsing"] }
