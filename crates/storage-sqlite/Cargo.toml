[package]
name = "local-agent-terminal-storage-sqlite"
version = "0.1.0"
edition = "2021"

[dependencies]
local-agent-terminal-application = { path = "../application" }
local-agent-terminal-domain = { path = "../domain" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1.0"
serde_json_canonicalizer = "0.3"
sha2 = "0.10"

[dev-dependencies]
local-agent-terminal-agent-protocol = { path = "../agent-protocol" }
local-agent-terminal-agent-runtime = { path = "../agent-runtime" }
local-agent-terminal-context-engine = { path = "../context-engine" }
local-agent-terminal-storage-files = { path = "../storage-files" }
