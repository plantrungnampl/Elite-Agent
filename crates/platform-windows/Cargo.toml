[package]
name = "local-agent-terminal-platform-windows"
version = "0.1.0"
edition = "2021"

[features]
test-seams = []

[dependencies]
cap-fs-ext = "4.0.2"
cap-std = "4.0.2"
local-agent-terminal-application = { path = "../application" }
local-agent-terminal-domain = { path = "../domain" }
sha2 = "0.10"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }

[dev-dependencies]
tempfile = "3.27"
