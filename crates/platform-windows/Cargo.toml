[package]
name = "local-agent-terminal-platform-windows"
version = "0.1.0"
edition = "2021"

[features]
test-seams = []

[dependencies]
cap-fs-ext = "4.0.2"
cap-std = "4.0.2"
local-agent-terminal-application = { path = "../application" }
local-agent-terminal-domain = { path = "../domain" }
sha2 = "0.10"
winapi-util = "0.1.11"
windows-sys = { version = "0.61.2", features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }

[dev-dependencies]
local-agent-terminal-platform-core = { path = "../platform-core" }
tempfile = "3.27"
