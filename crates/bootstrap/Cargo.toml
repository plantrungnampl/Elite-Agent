[package]
name = "local-agent-terminal-bootstrap"
version = "0.1.0"
edition = "2021"

[dependencies]
local-agent-terminal-agent-runtime = { path = "../agent-runtime" }
local-agent-terminal-application = { path = "../application" }
local-agent-terminal-policy-engine = { path = "../policy-engine" }
local-agent-terminal-provider-openai = { path = "../provider-openai" }
local-agent-terminal-repository-git = { path = "../repository-git" }
local-agent-terminal-storage-files = { path = "../storage-files" }
local-agent-terminal-storage-sqlite = { path = "../storage-sqlite" }
local-agent-terminal-tool-runtime = { path = "../tool-runtime" }
serde_json = "1.0"
serde_json_canonicalizer = "0.3"
sha2 = "0.10"
url = "2.5"

[target.'cfg(windows)'.dependencies]
local-agent-terminal-platform-windows = { path = "../platform-windows" }

[dev-dependencies]
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2", "unstable-sha256"] }
local-agent-terminal-domain = { path = "../domain" }
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3.27"
