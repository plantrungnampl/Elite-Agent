[package]
name = "local-agent-terminal-repository-git"
version = "0.1.0"
edition = "2021"

[features]
test-seams = []

[dependencies]
getrandom = "0.3"
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2", "unstable-sha256"] }
libgit2-sys = { version = "=0.18.4", features = ["vendored", "unstable-sha256"] }
local-agent-terminal-application = { path = "../application" }
local-agent-terminal-domain = { path = "../domain" }
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }

[dev-dependencies]
tempfile = "3"
