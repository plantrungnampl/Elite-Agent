name: M1 verification

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - run: node scripts/run-m1-evidence.mjs
      - run: node scripts/verify-m1-evidence.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m1-verification-${{ github.sha }}
          path: artifacts/verification/m1
