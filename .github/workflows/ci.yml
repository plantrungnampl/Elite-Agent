name: M2 verification

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - run: cargo test -p local-agent-terminal-tool-runtime --test security_matrix
      - run: cargo test -p local-agent-terminal-platform-windows --features test-seams --test filesystem_matrix --test process_matrix -- --test-threads=1
      - run: cargo test -p local-agent-terminal-bootstrap --test tool_broker_e2e --test tool_recovery
      - run: node scripts/run-m2-evidence.mjs
      - run: node scripts/verify-m2-evidence.mjs --require-approved
      - run: node scripts/run-m2-post-final-contracts.mjs
      - run: node scripts/verify-m2-post-final-log.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m2-verification-${{ github.sha }}
          path: artifacts/verification/m2
