name: M1 verification

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - run: pnpm install --frozen-lockfile
      - run: node scripts/verify-design-contracts.mjs
      - run: node --test tests/contracts/*.test.mjs
      - run: node scripts/verify-m1-evidence.mjs
      - run: node scripts/check-architecture.mjs
      - run: cargo test -p local-agent-terminal-repository-git --test windows_matrix
      - run: cargo test -p local-agent-terminal-bootstrap --test recovery_matrix
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets
      - run: pnpm --dir apps/desktop test --run
      - run: pnpm --dir apps/desktop exec playwright install chromium
      - run: pnpm --dir apps/desktop test:browser
      - run: pnpm --dir apps/desktop build
      - run: cargo build -p local-agent-terminal-desktop
      - run: git diff --check
      - run: git diff --check 321734f..HEAD
      - run: git diff --exit-code 321734f -- docs/multi-agent-terminal-design
